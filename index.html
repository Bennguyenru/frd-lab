/* VOICE: friendly, motivating learning dashboard for a student research lab

:root{color-scheme:light dark;

--navy:#00033d;--blue:#0058aa;--sky:#3abff0;--teal:#89e9d7;--grad-brand:linear-gradient(90deg,var(--blue),var(--sky) 70%,var(--teal));
--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-base:15px;--fs-lg:17px;
--r-xs:6px;--r-sm:8px;--r-md:10px;--r-lg:12px;--r-xl:16px;--r-pill:999px;
--sh-1:0 1px 0 rgba(0,3,61,.06);--sh-2:0 14px 32px rgba(0,3,61,.2);--sh-3:0 20px 60px rgba(0,3,61,.25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}

.btn{font:inherit;font-weight:600;min-height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
